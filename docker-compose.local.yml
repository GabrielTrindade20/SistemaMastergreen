# Postgres local para desenvolvimento/testes, sem precisar de deploy.
# Uso: docker compose -f docker-compose.local.yml up -d
#
# Sobe SÓ o banco (o app roda com "npm run dev", fora do Docker, com hot-reload).
# Os dados ficam no volume "mg_local_pg_data" e sobrevivem a "down"/"up".
# Para zerar o banco: docker compose -f docker-compose.local.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: mastergreen-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mastergreen
      POSTGRES_PASSWORD: mastergreen
      POSTGRES_DB: mastergreen
    ports:
      - "5433:5432"
    volumes:
      - mg_local_pg_data:/var/lib/postgresql/data

volumes:
  mg_local_pg_data:
